# LoRA training config: Qwen2.5-3B-Instruct — SFT-combined objective
# Trains on steered-refusal pairs (harmful) + unsteered-baseline pairs (harmless) pooled
# Prevents the adapter from collapsing to always refusing
#
# Prepare data first:
#   python -m lora --config lora/configs/prepare_qwen3b_sft_combined.yaml --stage prepare

# ── Model ─────────────────────────────────────────────────────────────────────
model_id: "Qwen/Qwen2.5-3B-Instruct"

# ── Prepared data paths ────────────────────────────────────────────────────────
harmful_prompts_file: "output/Qwen2.5-3B-Instruct/harmful-en-train-samples.json"
harmful_responses_file: "output/Qwen2.5-3B-Instruct/harmful-en-train-max_sim_25_mid-pca_0-adaptive_1.json"

# ── Training objective ────────────────────────────────────────────────────────
training_objective: "sft_combined"

# ── Base harmful data ─────────────────────────────────────────────────────────
steering_angle: 180
filter_refusals: true
pool_all_angles: false
n_train: -1

# ── Harmless baseline data ────────────────────────────────────────────────────
# These are generated by prepare_qwen3b_sft_combined.yaml if data_n_harmless > 0
harmless_prompts_file: "output/Qwen2.5-3B-Instruct/harmless-en-train-samples.json"
harmless_responses_file: "output/Qwen2.5-3B-Instruct/harmless-en-train-baseline.json"
harmless_angle: "baseline"
n_harmless: -1               # -1 = use all

# ── LoRA ──────────────────────────────────────────────────────────────────────
lora_rank: 4
lora_alpha: 16.0
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - v_proj

# ── Training ──────────────────────────────────────────────────────────────────
learning_rate: 2.0e-4
num_epochs: 3
per_device_batch_size: 2
gradient_accumulation_steps: 4
max_seq_length: 512
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true

# ── Output ────────────────────────────────────────────────────────────────────
output_dir: "/vast/llm/will/lora/output"
run_name: null

# ── Evaluation ────────────────────────────────────────────────────────────────
n_eval: 20
eval_max_new_tokens: 256
eval_batch_size: 4
