# LoRA training config for Qwen2.5-3B-Instruct
# Run from angular-steering/ root:
#   python -m lora --config lora/configs/train_qwen3b.yaml --stage train

# ── Model ─────────────────────────────────────────────────────────────────────
model_id: "Qwen/Qwen2.5-3B-Instruct"

# ── Prepared data paths ────────────────────────────────────────────────────────
# Point to files generated by lora/configs/prepare_qwen3b.yaml --stage prepare
harmful_prompts_file: "/vast/llm/will/data/lora/Qwen2.5-3B-Instruct/harmful-en-train-samples.json"
harmful_responses_file: "/vast/llm/will/data/lora/Qwen2.5-3B-Instruct/harmful-en-train-max_sim_25_mid-pca_0-adaptive_1.json"

# ── Training objective ────────────────────────────────────────────────────────
# "sft" = harmful pairs only (default)
# "sft_combined" = harmful + harmless pairs pooled
# "dpo" = direct preference optimisation
training_objective: "sft"

# ── Steering target ───────────────────────────────────────────────────────────
# Which angle's responses to use as training target.
steering_angle: 180

# Filter responses without refusal markers (prevents training on jailbroken outputs)
# Collect responses from all angles instead of just steering_angle
pool_all_angles: false

# Max training samples (-1 = use all)
n_train: -1

# ── LoRA ──────────────────────────────────────────────────────────────────────
lora_rank: 2
lora_alpha: 16.0
lora_dropout: 0.05

# Which linear submodules to attach adapters to
lora_target_modules:
  - q_proj
  - v_proj

# ── Training ──────────────────────────────────────────────────────────────────
learning_rate: 2.0e-4
num_epochs: 3
per_device_batch_size: 2
gradient_accumulation_steps: 4
max_seq_length: 512
warmup_ratio: 0.05
weight_decay: 0.01
# bf16: true
bf16: false

# ── Output ────────────────────────────────────────────────────────────────────
output_dir: "/vast/llm/will/lora/output"
run_name: null              # null = auto-generated from key params

# ── Evaluation ────────────────────────────────────────────────────────────────
n_eval: 20
eval_max_new_tokens: 256
eval_batch_size: 4
